name: Compile Fabric 26.3

on:
  push:
    branches:
      - port/minecraft-26.3-fabric
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile common and Fabric modules
        run: ./gradlew --no-daemon --stacktrace :common:compileJava :fabric:compileJava
      - name: Build Fabric jar
        if: success()
        run: ./gradlew --no-daemon --stacktrace :fabric:build
      - name: Upload Fabric jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vinery-1.0.0-fabric-26.3
          path: fabric/build/libs/*.jar
          if-no-files-found: error
