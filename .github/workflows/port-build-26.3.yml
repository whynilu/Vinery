name: Vinery 26.3 Fabric build

on:
  workflow_dispatch:
  push:
    branches:
      - port/minecraft-26.3-fabric

concurrency:
  group: vinery-26.3-fabric-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: ./gradlew --no-daemon :fabric:build --stacktrace
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vinery-fabric-minecraft-26.3
          path: fabric/build/libs/*.jar
          if-no-files-found: error
