loom {
    accessWidenerPath = file("src/main/resources/vinery.accesswidener")
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    compileOnly("net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    api("dev.architectury:architectury:${rootProject.architectury_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }

}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}

// EMI has no Minecraft 26.3 release yet; defer its optional integration.
sourceSets.main.java.exclude 'net/satisfy/vinery/core/compat/emi/**'
sourceSets.main.java.exclude 'net/satisfy/vinery/core/compat/jei/**'
sourceSets.main.java.exclude 'net/satisfy/vinery/core/compat/rei/**'
