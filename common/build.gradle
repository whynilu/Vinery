architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/vinery.accesswidener")
}

repositories {
}

dependencies {
    // Compile against Foundation without bundling it; the Fabric mod declares it as a runtime dependency.
    compileOnly("net.satisfy.foundation:foundation-common:${rootProject.foundation_version}") { transitive = false }
    compileOnly("net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    api("dev.architectury:architectury:${rootProject.architectury_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }

    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api:${rei_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    compileOnly("dev.emi:emi-xplat-intermediary:${rootProject.emi_version}:api")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
