plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    group = rootProject.maven_group
    version = rootProject.mod_version
    base { archivesName = rootProject.archives_base_name }

    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'LetsDoMaven'
                    url = 'https://raw.githubusercontent.com/Let-s-Do-Collection/Foundation/1.21.1/maven'
                }
            }
            filter { includeGroup 'net.satisfy.foundation' }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter { includeGroup 'maven.modrinth' }
        }
        maven { name = 'JaredsMaven'; url = 'https://maven.blamejared.com/' }
        maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}
